name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: litepacks/.github/.github/workflows/npm-release.yml@main
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      node-version: "22"
      require-tests: true
      require-build: true
      run-docboot: auto
      publish-access: public
      npm-tag: latest
      create-github-release: true
